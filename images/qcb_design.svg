        <path d="M 150 400 A 250 80 0 0 1 650 400" stroke="white" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
        <path d="M 150 400 A 250 80 0 0 0 650 400" stroke="white" stroke-width="3" fill="none"/>
    </g>

    <g id="axes">
        <line x1="400" y1="400" x2="190" y2="526" stroke="white" stroke-width="3" marker-end="url(#arrow)"/>
        <line x1="155" y1="535" x2="175" y2="555" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <line x1="175" y1="535" x2="155" y2="555" stroke="white" stroke-width="3" stroke-linecap="round"/>

        <line x1="400" y1="400" x2="680" y2="400" stroke="white" stroke-width="3" marker-end="url(#arrow)"/>
        <line x1="695" y1="385" x2="705" y2="400" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <line x1="715" y1="385" x2="695" y2="415" stroke="white" stroke-width="3" stroke-linecap="round"/>

        <line x1="400" y1="400" x2="400" y2="665" stroke="white" stroke-width="3" stroke-dasharray="6 6"/>
        
        <circle cx="400" cy="650" r="8" fill="white"/>

        <line x1="380" y1="675" x2="380" y2="705" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <polyline points="395,680 400,675 400,705" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="415,675 430,690 415,707" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="state-vector">
        <line x1="400" y1="400" x2="570" y2="230" stroke="white" stroke-width="4"/>
        
        <line x1="570" y1="230" x2="570" y2="458" stroke="white" stroke-width="2" stroke-dasharray="6 6"/>
        <line x1="400" y1="400" x2="570" y2="458" stroke="white" stroke-width="2" stroke-dasharray="6 6"/>

        <path d="M 400 280 A 120 120 0 0 1 484 315" stroke="white" stroke-width="2" fill="none"/>
        <ellipse cx="445" cy="275" rx="7" ry="11" stroke="white" stroke-width="2" fill="none"/>
        <line x1="437" y1="275" x2="453" y2="275" stroke="white" stroke-width="2"/>

        <path d="M 296 460 A 130 45 0 0 0 514 440" stroke="white" stroke-width="2.5" fill="none"/>
        <ellipse cx="425" cy="505" rx="7" ry="11" stroke="white" stroke-width="2" fill="none"/>
        <line x1="425" y1="488" x2="425" y2="522" stroke="white" stroke-width="2" stroke-linecap="round"/>

        <line x1="570" y1="230" x2="525" y2="175" stroke="white" stroke-width="2"/>
        <line x1="570" y1="230" x2="615" y2="165" stroke="white" stroke-width="2"/>
        <line x1="615" y1="165" x2="525" y2="175" stroke="white" stroke-width="2"/>
        
        <circle cx="525" cy="175" r="4" fill="white"/>
        <circle cx="615" cy="165" r="4" fill="white"/>
        
        <circle cx="570" cy="230" r="14" fill="none" stroke="white" stroke-width="3"/>
        <circle cx="570" cy="230" r="5" fill="white"/>
    </g>

    <g id="sather-tower">
