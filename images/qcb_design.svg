            <rect x="170" y="680" width="60" height="6" fill="none" stroke="white" stroke-width="4"/>
            
            <g id="shaft">
                <rect x="175" y="400" width="50" height="280" fill="none" stroke="white" stroke-width="4"/>
                
                <rect x="198" y="420" width="4" height="22" fill="white"/>
                <rect x="198" y="475" width="4" height="22" fill="white"/>
                <rect x="198" y="530" width="4" height="22" fill="white"/>
                <rect x="198" y="585" width="4" height="22" fill="white"/>
                <rect x="198" y="640" width="4" height="22" fill="white"/>
            </g>

            <g id="clock-tower">
                <rect x="172" y="380" width="56" height="20" fill="none" stroke="white" stroke-width="4"/>
                
                <rect x="172" y="310" width="56" height="70" fill="none" stroke="white" stroke-width="4"/>
                
                <circle cx="200" cy="345" r="16" fill="none" stroke="white" stroke-width="4"/>
                <circle cx="200" cy="345" r="13" fill="none" stroke="white" stroke-width="2"/>
                
                <line x1="200" y1="345" x2="206" y2="335" stroke="white" stroke-width="4" stroke-linecap="round"/>
                <line x1="200" y1="345" x2="203" y2="352" stroke="white" stroke-width="4" stroke-linecap="round"/>
                
                <polygon points="166,345 172,345 170,330" fill="none" stroke="white" stroke-width="2"/>
                <polygon points="234,345 228,345 230,330" fill="none" stroke="white" stroke-width="2"/>
            </g>

            <g id="belfry">
