                <rect x="173" y="250" width="54" height="50" fill="none" stroke="white" stroke-width="4"/>
                
                <rect x="178" y="262" width="10" height="28" fill="white" rx="4"/>
                <rect x="195" y="262" width="10" height="28" fill="white" rx="4"/>
                <rect x="212" y="262" width="10" height="28" fill="white" rx="4"/>
                
                <rect x="168" y="240" width="64" height="10" fill="none" stroke="white" stroke-width="4"/>
            </g>

            <g id="spire">
                <rect x="175" y="225" width="50" height="15" fill="none" stroke="white" stroke-width="4"/>
                
                <polygon points="175,225 225,225 210,175 190,175" fill="none" stroke="white" stroke-width="4"/>
                
                <line x1="200" y1="225" x2="200" y2="175" stroke="white" stroke-width="3"/>
                <line x1="187.5" y1="225" x2="195" y2="175" stroke="white" stroke-width="2"/>
                <line x1="212.5" y1="225" x2="205" y2="175" stroke="white" stroke-width="2"/>
                
                <rect x="190" y="165" width="20" height="10" fill="none" stroke="white" stroke-width="4"/>
                
                <rect x="192" y="145" width="16" height="20" fill="none" stroke="white" stroke-width="4"/>
                
                <rect x="194" y="150" width="4" height="10" fill="white" rx="1.5"/>
                <rect x="202" y="150" width="4" height="10" fill="white" rx="1.5"/>
                
                <polygon points="190,145 210,145 200,125" fill="none" stroke="white" stroke-width="4"/>
                
                <line x1="200" y1="125" x2="200" y2="90" stroke="white" stroke-width="4"/>
                
                <circle cx="200" cy="105" r="4" fill="white"/>
                <line x1="194" y1="110" x2="206" y2="110" stroke="white" stroke-width="3"/>
            </g>
        </g>

        <line x1="440" y1="105" x2="440" y2="135" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="455" cy="120" rx="8" ry="15" stroke="white" stroke-width="3" fill="none"/>
        <polyline points="470,105 485,120 470,138" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="logo-text">
        <line x1="625" y1="185" x2="625" y2="275" stroke="white" stroke-width="4" stroke-linecap="round"/>

        <circle cx="655" cy="230" r="18" stroke="white" stroke-width="4" fill="none"/>
        <line x1="673" y1="212" x2="673" y2="290" stroke="white" stroke-width="4" stroke-linecap="round"/>

        <path d="M 714 216 A 18 18 0 1 0 714 244" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>

        <circle cx="740" cy="230" r="18" stroke="white" stroke-width="4" fill="none"/>
        <line x1="722" y1="170" x2="722" y2="248" stroke="white" stroke-width="4" stroke-linecap="round"/>

        <polyline points="765,185 780,230 765,275" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>